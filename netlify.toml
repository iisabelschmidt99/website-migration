# Netlify-Konfiguration für das Next.js-Projekt im Unterordner fenyx-next/
[build]
  base = "fenyx-next"          # Projekt liegt in diesem Unterordner
  command = "npm run build"     # Next.js-Build
  publish = ".next"             # Build-Ausgabe (relativ zu base)

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* landen absichtlich im Client-Bundle — niemals als „Secret“ markieren
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_GTM_ID,NEXT_PUBLIC_ANALYTICS_INGRESS_URL"
  # In Netlify UI unter Site settings → Environment variables setzen:
  # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY

# Offizielles Next.js-Plugin: kümmert sich um Routing, Server-Rendering
# und die automatische Bildoptimierung von next/image.
[[plugins]]
  package = "@netlify/plugin-nextjs"
